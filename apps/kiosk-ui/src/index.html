<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Attendance Kiosk</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel hero">
        <div>
          <p class="eyebrow">Campus Face Recognition Attendance</p>
          <h1>Web Kiosk</h1>
          <p class="copy">Browser capture, enrollment guidance, attendance submission, and device status.</p>
        </div>
        <video id="camera" autoplay muted playsinline></video>
      </section>
      <section class="grid">
        <article class="panel"><h2>Enrollment Guidance</h2><ul><li>front</li><li>left_20</li><li>right_20</li><li>up_or_down</li></ul></article>
        <article class="panel"><h2>Attendance</h2><button id="capture">Capture Burst</button><pre id="result">idle</pre></article>
        <article class="panel"><h2>Device Status</h2><pre id="status">initializing</pre></article>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
  </html>
