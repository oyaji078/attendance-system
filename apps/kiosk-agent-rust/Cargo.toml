[package]
name = "kiosk-agent-rust"
version = "0.1.0"
edition = "2021"

[features]
default = []
camera = ["nokhwa"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fastrand = "2.1"
image = "0.25"
# 0.10 is the line that actually provides CameraIndex/RequestedFormat, the API
# this crate calls. The old "0.5" pin both mismatched the code and dragged in a
# yanked mozjpeg, which blocked dependency resolution for the whole workspace.
nokhwa = { version = "0.10", optional = true, features = ["input-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

